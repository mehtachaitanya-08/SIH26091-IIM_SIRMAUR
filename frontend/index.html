<!DOCTYPE html>

    <meta name="theme-color" content="#0E7A53" />
    <meta name="description" content="GraminAI — Hyper-Local Business Advisory & Concessional Credit Platform for Scheduled Caste Rural Micro-Entrepreneurs (MoSJE / NSFDC SIH26091)" />

    <!-- Tailwind CSS CDN for instant robust styling -->
    <script src="https://cdn.tailwindcss.com"></script>

          extend: {
            colors: {
              waltonGround: '#F4F1EA',
              waltonWarm: '#F8F6F0',
              waltonInk: '#111311',
              waltonMuted: '#686D65',
              dashBg: '#D4D8DD',

              accentCoral: '#E86043',
              concessionalEmerald: '#0E7A53',
              chipOchre: '#D49B5A',
              chipOlive: '#5A7352',
              chipSlate: '#4A6274',
              arcYellow: '#FACC15'
            },
            fontFamily: {
              cinzel: ['Cinzel', 'Georgia', 'serif'],
              editorial: ['"Instrument Serif"', 'Georgia', 'serif'],
              sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
              dashboard: ['"Inter Tight"', 'sans-serif'],
              mono: ['"Space Grotesk"', 'monospace']
            }
          }
        }
      }
